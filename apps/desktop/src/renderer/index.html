<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Her-Text</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- 主界面：小球 -->
      <div id="main-view" class="container">
        <canvas id="orb-canvas" width="180" height="180"></canvas>
        <div id="text-display" class="text-display"></div>
        <div class="controls">
          <div style="width: 100%; display: flex; gap: 8px; align-items: center;">
            <button id="start-conversation-btn" class="start-button" style="flex: 1;">Start Conversation</button>
            <button id="start-text-btn" class="tts-button" style="flex: 1;">Start Text</button>
          </div>
          <div id="status" class="status">Ready</div>
          <div style="width: 100%; display: flex; gap: 8px; align-items: center;">
            <input type="text" id="text-input" class="text-input" placeholder="Type your message..." />
            <button id="send-btn" class="tts-button" style="flex-shrink: 0; padding: 10px 20px;">Send</button>
          </div>
        </div>
      </div>

      <!-- 右键菜单 -->
      <div id="context-menu" class="context-menu">
        <div class="context-menu-item" data-action="settings">
          <span>设置</span>
        </div>
        <div class="context-menu-item" data-action="clear-history">
          <span>清除对话</span>
        </div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" data-action="about">
          <span>关于</span>
        </div>
      </div>

      <!-- 设置面板 -->
      <div id="settings-panel" class="settings-panel">
        <button id="settings-close" class="settings-close">×</button>

        <div class="settings-layout">
          <!-- 左侧导航 -->
          <nav class="settings-nav">
            <div class="nav-item active" data-section="voice">
              <span class="nav-icon">◉</span>
              <span class="nav-label">语音</span>
            </div>
            <div class="nav-item" data-section="memory">
              <span class="nav-icon">◎</span>
              <span class="nav-label">记忆</span>
            </div>
            <div class="nav-item" data-section="personality">
              <span class="nav-icon">◇</span>
              <span class="nav-label">人格</span>
            </div>
            <div class="nav-item" data-section="about">
              <span class="nav-icon">○</span>
              <span class="nav-label">关于</span>
            </div>
          </nav>

          <!-- 右侧内容区域 -->
          <div class="settings-content">
            <!-- 语音设置 -->
            <section id="section-voice" class="settings-section active">
              <h2 class="section-title">语音设置</h2>

              <div class="settings-card">
                <div class="settings-row">
                  <div class="row-info">
                    <span class="row-label">语音输入</span>
                    <span class="row-desc">使用麦克风进行语音对话</span>
                  </div>
                  <div class="settings-toggle">
                    <input type="checkbox" id="voice-input-toggle" checked />
                    <span class="toggle-slider"></span>
                  </div>
                </div>

                <div class="settings-row">
                  <div class="row-info">
                    <span class="row-label">语音输出</span>
                    <span class="row-desc">EVA 以语音方式回复</span>
                  </div>
                  <div class="settings-toggle">
                    <input type="checkbox" id="voice-output-toggle" checked />
                    <span class="toggle-slider"></span>
                  </div>
                </div>

                <div class="settings-row">
                  <div class="row-info">
                    <span class="row-label">音量</span>
                  </div>
                  <div class="settings-slider-group">
                    <input type="range" id="volume-slider" class="settings-slider" min="0" max="100" value="70" />
                    <span id="volume-value" class="settings-value">70%</span>
                  </div>
                </div>
              </div>
            </section>

            <!-- 记忆管理 -->
            <section id="section-memory" class="settings-section">
              <h2 class="section-title">记忆管理</h2>

              <div class="settings-card">
                <div class="settings-row">
                  <div class="row-info">
                    <span class="row-label">对话历史</span>
                    <span class="row-desc">清除所有对话记录</span>
                  </div>
                  <button id="clear-history-btn" class="settings-btn danger">清除</button>
                </div>

                <div class="settings-row">
                  <div class="row-info">
                    <span class="row-label">用户画像</span>
                    <span class="row-desc">重置 EVA 对你的了解</span>
                  </div>
                  <button id="clear-profile-btn" class="settings-btn">重置</button>
                </div>
              </div>
            </section>

            <!-- 人格设置 -->
            <section id="section-personality" class="settings-section">
              <h2 class="section-title">人格</h2>

              <div class="settings-card">
                <div class="settings-row">
                  <div class="row-info">
                    <span class="row-label">当前人格</span>
                    <span class="row-desc">选择 AI 伴侣的人格配置</span>
                  </div>
                  <select id="personality-select" class="settings-select">
                    <option value="eva" selected>EVA - 陈知遥</option>
                  </select>
                </div>
              </div>
            </section>

            <!-- 关于 -->
            <section id="section-about" class="settings-section">
              <h2 class="section-title">关于</h2>

              <div class="about-card">
                <div class="about-orb"></div>
                <h3 class="about-name">Her-Text</h3>
                <p class="about-version">v0.1.0</p>
                <p class="about-desc">一个有温度的 AI 伴侣</p>
                <div class="about-quote">
                  "能够被听见、被记得、被回应，<br/>本身就是很珍贵的事情。"
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
