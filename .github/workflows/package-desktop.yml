name: Package Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.1"
        required: true
        type: string
      platform:
        description: "Desktop platform to package"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - mac
          - windows
      draft:
        description: "Create the GitHub Release as a draft"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.version.outputs.tag_exists }}
      package_matrix: ${{ steps.version.outputs.package_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate release version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          TAG_EXISTS=false
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists, reusing it: $TAG"
            TAG_EXISTS=true
          fi
          case "${{ github.event.inputs.platform }}" in
            all)
              PACKAGE_MATRIX='{"include":[{"platform":"mac","os":"macos-latest","builder_args":"--mac","artifact_name":"noema-macos"},{"platform":"windows","os":"windows-latest","builder_args":"--win","artifact_name":"noema-windows"}]}'
              ;;
            mac)
              PACKAGE_MATRIX='{"include":[{"platform":"mac","os":"macos-latest","builder_args":"--mac","artifact_name":"noema-macos"}]}'
              ;;
            windows)
              PACKAGE_MATRIX='{"include":[{"platform":"windows","os":"windows-latest","builder_args":"--win","artifact_name":"noema-windows"}]}'
              ;;
            *)
              echo "Invalid platform: ${{ github.event.inputs.platform }}"
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "package_matrix=$PACKAGE_MATRIX" >> "$GITHUB_OUTPUT"

      - name: Update package versions
        if: ${{ steps.version.outputs.tag_exists != 'true' }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const version = process.env.RELEASE_VERSION
          for (const file of ['package.json', 'packages/sdk/package.json', 'apps/desktop/package.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'))
            json.version = version
            fs.writeFileSync(file, `${JSON.stringify(json, null, 2)}\n`)
          }
          NODE
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Commit and tag release
        if: ${{ steps.version.outputs.tag_exists != 'true' }}
        run: |
          git add package.json packages/sdk/package.json apps/desktop/package.json
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore: release ${{ steps.version.outputs.tag }}"
          else
            git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          fi
          git tag ${{ steps.version.outputs.tag }}
          git push origin HEAD:${{ github.ref_name }}
          git push origin ${{ steps.version.outputs.tag }}

  package:
    name: Package ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.package_matrix) }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK and desktop app
        run: |
          pnpm --filter @noema/sdk build
          pnpm --filter @noema/desktop build

      - name: Package desktop app
        run: pnpm --filter @noema/desktop exec electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Noema ${{ needs.prepare.outputs.tag }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.zip
            release-artifacts/*.blockmap
            release-artifacts/latest*.yml
