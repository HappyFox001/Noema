name: Package Desktop Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Validate tag and package versions
        id: release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "Release tags must be annotated: $TAG"
            exit 1
          fi
          git fetch origin main
          RELEASE_COMMIT="$(git rev-list -n 1 "$TAG")"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "Release tag must point to a commit on main: $TAG"
            exit 1
          fi
          pnpm check:release-version "$VERSION"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-latest
            builder_args: --mac
            artifact_name: noema-macos
          - platform: windows
            os: windows-latest
            builder_args: --win
            artifact_name: noema-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate desktop packaging contract
        run: pnpm check:desktop-packaging

      - name: Build SDK and desktop app
        run: |
          pnpm --filter @noema/sdk build
          pnpm --filter @noema/desktop build

      - name: Package desktop app
        run: pnpm --filter @noema/desktop exec electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - validate
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Noema ${{ github.ref_name }}
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## macOS first launch

            If macOS blocks Noema from opening after installation, run:

            ```bash
            find /Applications/Noema.app -exec xattr -c {} \;
            ```

            This clears quarantine attributes from the app bundle and allows macOS to launch it.
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.zip
            release-artifacts/*.blockmap
            release-artifacts/latest*.yml
